<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="color-scheme" content="dark">
<title>BondStats Live Financial Centre Clocks</title>
<style>
:root{
  --bg:#060907;
  --card:#09100c;
  --border:#1b2a21;
  --border2:#26382d;
  --text:#f3f6f3;
  --muted:#7d8a82;
  --muted2:#536058;
  --green:#78e65b;
  --safe-mobile-width:320px;
}
*{box-sizing:border-box}
html,body{
  margin:0!important;
  padding:0!important;
  min-width:0!important;
  max-width:100%!important;
  background:transparent!important;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden!important;
}
body{width:100%!important}
.widget{
  width:100%;
  max-width:100%;
  background:var(--bg);
  padding:14px 10px 18px;
  overflow:hidden!important;
}
.heading{
  margin:0 0 11px;
  color:#ebf0ec;
  font-size:11px;
  font-weight:800;
  letter-spacing:.21em;
  text-transform:uppercase;
}
.desktop-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;
  width:100%;
  max-width:100%;
}
.card{
  min-width:0;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:17px;
  background:linear-gradient(180deg,#09100c 0%,#080d0a 100%);
  padding:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.top{
  width:100%;
  min-width:0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}
.city{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  font-weight:760;
}
.zone{
  margin-top:3px;
  color:var(--muted2);
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.badge{
  flex:0 0 auto;
  border:1px solid var(--border);
  border-radius:999px;
  padding:5px 8px;
  color:var(--muted2);
  font-size:8px;
  line-height:1;
  white-space:nowrap;
}
.badge.open{
  color:var(--green);
  border-color:rgba(120,230,91,.28);
  background:rgba(120,230,91,.04);
}
.clock{
  position:relative;
  width:106px;
  height:106px;
  max-width:70%;
  flex:0 0 auto;
  margin:15px auto 13px;
  border:1px solid var(--border2);
  border-radius:50%;
  background:radial-gradient(circle,rgba(120,230,91,.04),transparent 48%);
}
.mark{
  position:absolute;
  left:50%;
  top:4px;
  width:1px;
  height:9px;
  background:#405047;
  transform-origin:50% 49px;
}
.hand{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:50% 100%;
  border-radius:4px;
}
.hour{width:3px;height:28%;margin-left:-1.5px;background:#d7ddd8}
.minute{width:2px;height:38%;margin-left:-1px;background:#aeb8b1}
.second{width:1px;height:42%;margin-left:-.5px;background:var(--green)}
.pin{
  position:absolute;
  left:50%;
  top:50%;
  width:8px;height:8px;
  margin:-4px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px rgba(120,230,91,.35);
}
.digital{
  font-size:22px;
  font-weight:650;
  line-height:1;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.desc{
  width:100%;
  min-height:24px;
  margin-top:9px;
  color:var(--muted);
  font-size:9px;
  line-height:1.35;
  text-align:center;
}

/* Google Sites hardened mobile mode.
   It intentionally does NOT trust iframe width at all. */
html.mobile-lock,
html.mobile-lock body{
  width:var(--safe-mobile-width)!important;
  min-width:var(--safe-mobile-width)!important;
  max-width:var(--safe-mobile-width)!important;
  overflow-x:hidden!important;
}
.mobile-lock .widget{
  width:var(--safe-mobile-width)!important;
  min-width:var(--safe-mobile-width)!important;
  max-width:var(--safe-mobile-width)!important;
  padding:10px 7px 12px!important;
}
.mobile-lock .heading{
  font-size:9px;
  letter-spacing:.16em;
  margin:0 0 8px 1px;
}
.mobile-lock .desktop-grid{
  display:block!important;
  width:100%!important;
  max-width:100%!important;
}
.mobile-lock .card{
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  height:82px;
  margin:0 0 7px!important;
  padding:9px 10px!important;
  border-radius:13px;
  display:grid!important;
  grid-template-columns:82px 52px minmax(0,1fr)!important;
  grid-template-rows:1fr 1fr!important;
  column-gap:8px!important;
  row-gap:0!important;
  align-items:center!important;
}
.mobile-lock .card:last-child{margin-bottom:0!important}
.mobile-lock .top{
  grid-column:1!important;
  grid-row:1 / 3!important;
  display:block!important;
  width:82px!important;
  overflow:hidden!important;
}
.mobile-lock .city{
  font-size:11px!important;
  max-width:82px!important;
}
.mobile-lock .zone{font-size:7px!important}
.mobile-lock .badge{
  display:inline-block!important;
  max-width:78px!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  margin-top:7px!important;
  padding:4px 6px!important;
  font-size:6.5px!important;
}
.mobile-lock .clock{
  grid-column:2!important;
  grid-row:1 / 3!important;
  width:50px!important;
  height:50px!important;
  max-width:50px!important;
  margin:0!important;
}
.mobile-lock .clock .mark{
  top:2px!important;
  height:5px!important;
  transform-origin:50% 23px!important;
}
.mobile-lock .pin{
  width:6px!important;height:6px!important;margin:-3px!important;
}
.mobile-lock .digital{
  grid-column:3!important;
  grid-row:1!important;
  align-self:end!important;
  width:100%!important;
  max-width:100%!important;
  overflow:hidden!important;
  font-size:18px!important;
  text-align:left!important;
}
.mobile-lock .desc{
  grid-column:3!important;
  grid-row:2!important;
  align-self:start!important;
  width:100%!important;
  max-width:100%!important;
  min-height:0!important;
  margin:3px 0 0!important;
  overflow:hidden!important;
  color:var(--muted)!important;
  font-size:7px!important;
  line-height:1.18!important;
  text-align:left!important;
}

/* extra safety: if CSS itself detects a real narrow viewport */
@media (max-width:700px), (hover:none) and (pointer:coarse){
  html:not(.mobile-lock) body{
    overflow-x:hidden!important;
  }
}
</style>
</head>
<body>
<section class="widget">
  <h1 class="heading">Live Financial Centre Clocks</h1>
  <div class="desktop-grid" id="grid"></div>
</section>

<script>
(()=>{
"use strict";

const centres=[
  {city:"Tokyo",abbr:"JST",zone:"Asia/Tokyo",open:540,close:930,desc:"Asia rates & sovereign liquidity"},
  {city:"Singapore",abbr:"SGT",zone:"Asia/Singapore",open:540,close:1020,desc:"FX, treasury & regional funding"},
  {city:"Hong Kong",abbr:"HKT",zone:"Asia/Hong_Kong",open:570,close:960,desc:"China / offshore liquidity bridge"},
  {city:"London",abbr:"UK",zone:"Europe/London",open:480,close:990,desc:"Global FX & transatlantic handover"},
  {city:"New York",abbr:"ET",zone:"America/New_York",open:570,close:960,desc:"Treasuries, dollar funding & macro data"}
];

const doc=document.documentElement;
const grid=document.getElementById("grid");

function numberOrNull(v){
  return Number.isFinite(v) && v>0 ? v : null;
}

function physicalShortSide(){
  const vals=[];
  if(window.screen){
    const sw=numberOrNull(screen.width), sh=numberOrNull(screen.height);
    if(sw) vals.push(sw);
    if(sh) vals.push(sh);
    const aw=numberOrNull(screen.availWidth), ah=numberOrNull(screen.availHeight);
    if(aw) vals.push(aw);
    if(ah) vals.push(ah);
  }
  return vals.length ? Math.min(...vals) : null;
}

function shouldLockMobile(){
  const ua=navigator.userAgent || "";
  const mobileUA=/Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(ua);
  const coarse=window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  const touch=(navigator.maxTouchPoints||0)>0;
  const shortSide=physicalShortSide();
  const physicallyNarrow=shortSide!==null && shortSide<=820;
  return mobileUA || coarse || (touch && physicallyNarrow);
}

function applyMobileLock(){
  if(!shouldLockMobile()){
    doc.classList.remove("mobile-lock");
    doc.style.removeProperty("--safe-mobile-width");
    return;
  }

  const shortSide=physicalShortSide();
  // Deliberately conservative. Google Sites adds its own side margins on mobile.
  // Even if screen metrics are wrong/high, never exceed 320 CSS px.
  let safe=320;
  if(shortSide!==null){
    safe=Math.min(320, Math.max(260, Math.floor(shortSide-36)));
  }
  doc.classList.add("mobile-lock");
  doc.style.setProperty("--safe-mobile-width", safe+"px");
}

applyMobileLock();
window.addEventListener("resize",applyMobileLock,{passive:true});
window.addEventListener("orientationchange",applyMobileLock,{passive:true});

function makeFormatter(zone,opts){
  return new Intl.DateTimeFormat("en-GB",{timeZone:zone,...opts});
}
const partFmt=centres.map(c=>makeFormatter(c.zone,{
  weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
}));
const timeFmt=centres.map(c=>makeFormatter(c.zone,{
  hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
}));

function marks(){
  let s="";
  for(let i=0;i<12;i++){
    s+=`<i class="mark" style="transform:translateX(-50%) rotate(${i*30}deg)"></i>`;
  }
  return s;
}

const cards=centres.map(c=>{
  const el=document.createElement("article");
  el.className="card";
  el.innerHTML=`
    <div class="top">
      <div>
        <div class="city">${c.city}</div>
        <div class="zone">${c.abbr}</div>
      </div>
      <div class="badge" data-badge>Off core hours</div>
    </div>
    <div class="clock">
      ${marks()}
      <i class="hand hour"></i>
      <i class="hand minute"></i>
      <i class="hand second"></i>
      <i class="pin"></i>
    </div>
    <div class="digital" data-time>--:--:--</div>
    <div class="desc">${c.desc}</div>`;
  grid.appendChild(el);
  return el;
});

function getParts(date,i){
  const out={};
  for(const p of partFmt[i].formatToParts(date)){
    if(p.type!=="literal") out[p.type]=p.value;
  }
  return out;
}

function update(){
  const now=new Date();

  centres.forEach((c,i)=>{
    const p=getParts(now,i);
    const h=(Number(p.hour)||0)%24;
    const m=Number(p.minute)||0;
    const s=Number(p.second)||0;
    const mins=h*60+m;
    const weekend=p.weekday==="Sat"||p.weekday==="Sun";
    const open=!weekend && mins>=c.open && mins<c.close;

    const card=cards[i];
    const badge=card.querySelector("[data-badge]");

    card.querySelector("[data-time]").textContent=timeFmt[i].format(now);
    badge.textContent=open ? "Core hours" : "Off core hours";
    badge.classList.toggle("open",open);

    card.querySelector(".hour").style.transform=`rotate(${(h%12)*30 + m*.5}deg)`;
    card.querySelector(".minute").style.transform=`rotate(${m*6 + s*.1}deg)`;
    card.querySelector(".second").style.transform=`rotate(${s*6}deg)`;
  });
}

try{
  centres.forEach(c=>makeFormatter(c.zone,{}).format(new Date()));
  update();
  setInterval(update,1000);
}catch(err){
  console.error("BondStats Financial Centre Clock:",err);
}
})();
</script>
</body>
</html>
