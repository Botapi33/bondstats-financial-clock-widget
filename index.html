<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BondStats Live Financial Centre Clocks</title>
<style>
:root{
  --bg:#050806;
  --card:#08100b;
  --line:#1b2b21;
  --line2:#263a2d;
  --text:#f4f7f4;
  --muted:#7f8d84;
  --muted2:#536158;
  --green:#75e75b;
}
*{box-sizing:border-box}
html,body{
  margin:0!important;
  padding:0!important;
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  overflow-x:hidden!important;
  background:transparent;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body{display:block}
.widget{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% -40%,rgba(70,255,139,.055),transparent 38%),
    var(--bg);
  padding:15px 10px 18px;
}
.heading{
  margin:0 0 12px 1px;
  font-size:10px;
  line-height:1;
  font-weight:800;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#e8ede9;
}
.grid{
  width:100%;
  max-width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;
}
.card{
  min-width:0;
  width:100%;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:17px;
  background:linear-gradient(180deg,#09110c 0%,#070c09 100%);
  padding:14px 13px 13px;
}
.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:7px;
  width:100%;
  min-width:0;
}
.place{min-width:0}
.city{
  font-size:13px;
  line-height:1.1;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.zone{
  margin-top:4px;
  color:var(--muted2);
  font-size:8px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.state{
  flex:0 0 auto;
  padding:5px 7px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted2);
  font-size:7px;
  line-height:1;
  white-space:nowrap;
}
.state.open{
  color:var(--green);
  border-color:rgba(117,231,91,.27);
  background:rgba(117,231,91,.035);
}
.face{
  position:relative;
  width:min(104px,74%);
  aspect-ratio:1;
  margin:15px auto 13px;
  border:1px solid var(--line2);
  border-radius:50%;
  background:
    radial-gradient(circle,rgba(117,231,91,.045),transparent 44%),
    #070c09;
}
.tick{
  position:absolute;
  left:50%;
  top:3px;
  width:1px;
  height:8px;
  background:#3c4b42;
  transform-origin:50% calc(50px - 3px);
}
.hand{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:50% 100%;
  border-radius:999px;
}
.hour{width:3px;height:27%;margin-left:-1.5px;background:#e4e8e4}
.minute{width:2px;height:37%;margin-left:-1px;background:#aeb8b1}
.second{width:1px;height:42%;margin-left:-.5px;background:var(--green)}
.pin{
  position:absolute;
  left:50%;top:50%;
  width:8px;height:8px;
  margin:-4px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(117,231,91,.35);
}
.digital{
  text-align:center;
  font-size:22px;
  line-height:1;
  font-weight:650;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.date{
  margin-top:6px;
  text-align:center;
  color:var(--muted2);
  font-size:8px;
  line-height:1.2;
}
.note{
  margin-top:10px;
  padding-top:9px;
  border-top:1px solid rgba(255,255,255,.05);
  text-align:center;
  color:var(--muted);
  font-size:8px;
  line-height:1.28;
}
.mobile .widget{padding:10px 7px 12px}
.mobile .heading{font-size:9px;letter-spacing:.17em;margin-bottom:8px}
.mobile .grid{
  display:flex!important;
  flex-direction:column!important;
  width:100%!important;
  max-width:100%!important;
  gap:7px!important;
}
.mobile .card{
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  padding:10px 11px!important;
  border-radius:13px!important;
  display:grid!important;
  grid-template-columns:66px minmax(0,1fr)!important;
  grid-template-rows:auto auto auto!important;
  column-gap:11px!important;
  align-items:center!important;
}
.mobile .card-top{
  grid-column:2!important;
  grid-row:1!important;
  min-width:0!important;
}
.mobile .face{
  grid-column:1!important;
  grid-row:1 / 4!important;
  width:58px!important;
  height:58px!important;
  max-width:none!important;
  margin:0!important;
}
.mobile .tick{
  top:2px!important;
  height:5px!important;
  transform-origin:50% 27px!important;
}
.mobile .pin{
  width:6px!important;height:6px!important;margin:-3px!important;
}
.mobile .digital{
  grid-column:2!important;
  grid-row:2!important;
  margin-top:5px!important;
  text-align:left!important;
  font-size:19px!important;
}
.mobile .date{
  display:none!important;
}
.mobile .note{
  grid-column:2!important;
  grid-row:3!important;
  margin:5px 0 0!important;
  padding:0!important;
  border:0!important;
  text-align:left!important;
  font-size:7px!important;
  overflow-wrap:anywhere!important;
}
.mobile .city{font-size:11px!important}
.mobile .zone{font-size:7px!important}
.mobile .state{
  font-size:6px!important;
  padding:4px 6px!important;
  max-width:84px!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}
@media(max-width:700px){
  html:not(.mobile) .grid{
    grid-template-columns:1fr!important;
  }
}
</style>
</head>
<body>
<section class="widget">
  <h1 class="heading">Live Financial Centre Clocks</h1>
  <div class="grid" id="grid"></div>
</section>

<script>
(()=>{
"use strict";

const centres=[
 {city:"Tokyo",abbr:"JST",zone:"Asia/Tokyo",open:540,close:930,hours:"09:00–15:30",note:"Asia rates & sovereign liquidity"},
 {city:"Singapore",abbr:"SGT",zone:"Asia/Singapore",open:540,close:1020,hours:"09:00–17:00",note:"FX, treasury & regional funding"},
 {city:"Hong Kong",abbr:"HKT",zone:"Asia/Hong_Kong",open:570,close:960,hours:"09:30–16:00",note:"China / offshore liquidity bridge"},
 {city:"London",abbr:"UK",zone:"Europe/London",open:480,close:990,hours:"08:00–16:30",note:"Global FX & transatlantic handover"},
 {city:"New York",abbr:"ET",zone:"America/New_York",open:570,close:960,hours:"09:30–16:00",note:"Treasuries, dollar funding & macro data"}
];

const html=document.documentElement;
const grid=document.getElementById("grid");

function finite(v){return Number.isFinite(v)&&v>0?v:null}

function actualWidth(){
  const vals=[];
  const de=document.documentElement;
  const b=document.body;
  [
    window.innerWidth,
    de && de.clientWidth,
    b && b.clientWidth,
    window.visualViewport && visualViewport.width,
    window.screen && screen.width,
    window.screen && screen.availWidth
  ].forEach(v=>{v=finite(Number(v));if(v)vals.push(v)});
  return vals.length?Math.min(...vals):null;
}

function mobileSignal(){
  const ua=navigator.userAgent||"";
  const uaMobile=/Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(ua);
  const coarse=window.matchMedia&&window.matchMedia("(hover:none) and (pointer:coarse)").matches;
  const w=actualWidth();
  return uaMobile||coarse||(w!==null&&w<=700);
}

function applyLayout(){
  html.classList.toggle("mobile",mobileSignal());
}
applyLayout();
window.addEventListener("resize",applyLayout,{passive:true});
if(window.visualViewport) visualViewport.addEventListener("resize",applyLayout,{passive:true});

function fmt(zone,opts){
  return new Intl.DateTimeFormat("en-GB",{timeZone:zone,...opts});
}
const partsFmt=centres.map(c=>fmt(c.zone,{
  weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
}));
const timeFmt=centres.map(c=>fmt(c.zone,{
  hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
}));
const dateFmt=centres.map(c=>fmt(c.zone,{
  weekday:"short",day:"2-digit",month:"short"
}));

function marks(){
  let s="";
  for(let i=0;i<12;i++){
    s+=`<i class="tick" style="transform:translateX(-50%) rotate(${i*30}deg)"></i>`;
  }
  return s;
}

const cards=centres.map(c=>{
  const el=document.createElement("article");
  el.className="card";
  el.innerHTML=`
    <div class="card-top">
      <div class="place">
        <div class="city">${c.city}</div>
        <div class="zone">${c.abbr}</div>
      </div>
      <div class="state" data-state>Off core hours</div>
    </div>
    <div class="face">
      ${marks()}
      <i class="hand hour"></i>
      <i class="hand minute"></i>
      <i class="hand second"></i>
      <i class="pin"></i>
    </div>
    <div class="digital" data-time>--:--:--</div>
    <div class="date" data-date>---</div>
    <div class="note">${c.note} · ${c.hours}</div>
  `;
  grid.appendChild(el);
  return el;
});

function localParts(d,i){
  const out={};
  for(const p of partsFmt[i].formatToParts(d)){
    if(p.type!=="literal")out[p.type]=p.value;
  }
  return out;
}

function update(){
  const now=new Date();
  centres.forEach((c,i)=>{
    const p=localParts(now,i);
    const h=(Number(p.hour)||0)%24;
    const m=Number(p.minute)||0;
    const s=Number(p.second)||0;
    const mins=h*60+m;
    const weekend=p.weekday==="Sat"||p.weekday==="Sun";
    const open=!weekend&&mins>=c.open&&mins<c.close;
    const card=cards[i];
    const state=card.querySelector("[data-state]");

    card.querySelector("[data-time]").textContent=timeFmt[i].format(now);
    card.querySelector("[data-date]").textContent=dateFmt[i].format(now);
    state.textContent=open?"Core hours":"Off core hours";
    state.classList.toggle("open",open);

    card.querySelector(".hour").style.transform=`rotate(${(h%12)*30+m*.5}deg)`;
    card.querySelector(".minute").style.transform=`rotate(${m*6+s*.1}deg)`;
    card.querySelector(".second").style.transform=`rotate(${s*6}deg)`;
  });
}

try{
  centres.forEach(c=>fmt(c.zone,{}).format(new Date()));
  update();
  setInterval(update,1000);
}catch(err){
  console.error("BondStats Financial Clock",err);
}
})();
</script>
</body>
</html>
