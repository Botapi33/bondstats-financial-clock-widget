<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BondStats Live Financial Centre Clocks</title>
<style>
:root{
  --bg:#060907;--card:#09100c;--border:#1b2a21;--border2:#26382d;
  --text:#f3f6f3;--muted:#7d8a82;--muted2:#536058;--green:#78e65b;
  --device-w:100vw;
}
*{box-sizing:border-box;min-width:0}
html,body{
  margin:0;padding:0;width:100%;max-width:100%;
  background:transparent;color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden!important;
}
body{display:block}
.wrap{
  width:100%;max-width:100%;
  background:var(--bg);
  padding:16px 10px 20px;
  overflow:hidden!important;
}
.title{
  font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  margin:0 0 12px;color:#e9eeea;
}
.grid{
  width:100%;max-width:100%;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;
  overflow:hidden;
}
.card{
  min-width:0;width:100%;max-width:100%;
  border:1px solid var(--border);border-radius:17px;
  padding:14px 14px 13px;
  background:linear-gradient(180deg,#09100c,#080d0a);
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
}
.top{
  width:100%;max-width:100%;
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
}
.cityblock{min-width:0}
.city{
  font-size:13px;font-weight:760;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.zone{
  font-size:9px;color:var(--muted2);letter-spacing:.12em;
  margin-top:3px;text-transform:uppercase;
}
.badge{
  flex:0 0 auto;
  border:1px solid var(--border);border-radius:999px;padding:5px 8px;
  color:var(--muted2);font-size:8px;white-space:nowrap;line-height:1;
}
.badge.open{
  color:var(--green);border-color:rgba(120,230,91,.26);
  background:rgba(120,230,91,.035);
}
.clock{
  --clock-size:112px;
  width:var(--clock-size);height:var(--clock-size);
  max-width:70%;margin:16px auto 13px;
  position:relative;border:1px solid var(--border2);border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(120,230,91,.035),transparent 42%);
  flex:0 0 auto;
}
.tick{
  position:absolute;left:50%;top:50%;
  width:1px;height:8px;background:#425047;
  transform-origin:50% 50%;
}
.hand{
  position:absolute;left:50%;bottom:50%;
  transform-origin:50% 100%;border-radius:4px;
}
.hour{width:3px;height:29%;background:#d8ded9;margin-left:-1.5px}
.minute{width:2px;height:38%;background:#aeb8b1;margin-left:-1px}
.second{width:1px;height:42%;background:var(--green);margin-left:-.5px}
.pin{
  position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;
  border-radius:50%;background:var(--green);
  box-shadow:0 0 8px rgba(120,230,91,.35);
}
.digital{
  font-size:22px;line-height:1;font-weight:650;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.desc{
  width:100%;font-size:9px;color:var(--muted);text-align:center;
  line-height:1.35;margin-top:9px;min-height:24px;
}

/* TRUE MOBILE MODE:
   Width is explicitly constrained by JS to real screen width,
   so Google Sites' oversized iframe viewport cannot force desktop rendering. */
html.force-mobile,
html.force-mobile body{
  width:var(--device-w)!important;
  max-width:var(--device-w)!important;
  min-width:0!important;
  overflow-x:hidden!important;
}
.force-mobile .wrap{
  width:var(--device-w)!important;
  max-width:var(--device-w)!important;
  padding:10px 8px 12px;
}
.force-mobile .title{
  margin:0 0 9px 2px;
  font-size:9px;
  letter-spacing:.18em;
}
.force-mobile .grid{
  width:100%!important;
  max-width:100%!important;
  display:flex!important;
  flex-direction:column!important;
  gap:7px;
}
.force-mobile .card{
  width:100%!important;
  max-width:100%!important;
  min-height:92px;
  border-radius:14px;
  padding:10px 11px;
  display:grid;
  grid-template-columns:minmax(88px,1fr) 64px minmax(108px,1.25fr);
  grid-template-rows:auto auto;
  column-gap:10px;
  row-gap:4px;
  align-items:center;
}
.force-mobile .top{
  grid-column:1;
  grid-row:1/3;
  display:block;
  align-self:center;
}
.force-mobile .badge{
  display:inline-flex;
  margin-top:8px;
  padding:4px 7px;
  font-size:7px;
}
.force-mobile .city{font-size:12px}
.force-mobile .zone{font-size:8px}
.force-mobile .clock{
  --clock-size:60px;
  grid-column:2;
  grid-row:1/3;
  width:60px;height:60px;
  max-width:none;
  margin:0;
}
.force-mobile .clock .tick{height:5px}
.force-mobile .pin{width:6px;height:6px;margin:-3px}
.force-mobile .digital{
  grid-column:3;
  grid-row:1;
  align-self:end;
  font-size:19px;
  text-align:left;
}
.force-mobile .desc{
  grid-column:3;
  grid-row:2;
  align-self:start;
  margin:0;
  min-height:0;
  text-align:left;
  font-size:8px;
  line-height:1.25;
}

/* Normal responsive fallback for browsers where iframe width is honest. */
@media(max-width:700px){
  html:not(.force-mobile) .wrap{padding:10px 8px 12px}
  html:not(.force-mobile) .grid{display:flex;flex-direction:column;gap:7px}
  html:not(.force-mobile) .card{
    min-height:92px;padding:10px 11px;border-radius:14px;
    display:grid;
    grid-template-columns:minmax(88px,1fr) 64px minmax(108px,1.25fr);
    grid-template-rows:auto auto;
    column-gap:10px;row-gap:4px;align-items:center;
  }
  html:not(.force-mobile) .top{grid-column:1;grid-row:1/3;display:block}
  html:not(.force-mobile) .badge{display:inline-flex;margin-top:8px;padding:4px 7px;font-size:7px}
  html:not(.force-mobile) .clock{
    --clock-size:60px;grid-column:2;grid-row:1/3;
    width:60px;height:60px;max-width:none;margin:0
  }
  html:not(.force-mobile) .digital{grid-column:3;grid-row:1;align-self:end;font-size:19px}
  html:not(.force-mobile) .desc{
    grid-column:3;grid-row:2;align-self:start;margin:0;min-height:0;
    text-align:left;font-size:8px
  }
}
@media(max-width:350px){
  .force-mobile .card,
  html:not(.force-mobile) .card{
    grid-template-columns:minmax(76px,.95fr) 52px minmax(94px,1.2fr);
    column-gap:7px;padding:9px;
  }
  .force-mobile .clock,
  html:not(.force-mobile) .clock{width:50px;height:50px}
  .force-mobile .digital,
  html:not(.force-mobile) .digital{font-size:17px}
  .force-mobile .desc,
  html:not(.force-mobile) .desc{font-size:7px}
  .force-mobile .city,
  html:not(.force-mobile) .city{font-size:11px}
}
</style>
</head>
<body>
<section class="wrap" id="root">
  <h1 class="title">Live Financial Centre Clocks</h1>
  <div class="grid" id="grid"></div>
</section>

<script>
(()=>{
"use strict";

const centres=[
 {city:"Tokyo",abbr:"JST",zone:"Asia/Tokyo",open:540,close:930,desc:"Asia rates & sovereign liquidity"},
 {city:"Singapore",abbr:"SGT",zone:"Asia/Singapore",open:540,close:1020,desc:"FX, treasury & regional funding"},
 {city:"Hong Kong",abbr:"HKT",zone:"Asia/Hong_Kong",open:570,close:960,desc:"China / offshore liquidity bridge"},
 {city:"London",abbr:"UK",zone:"Europe/London",open:480,close:990,desc:"Global FX & transatlantic handover"},
 {city:"New York",abbr:"ET",zone:"America/New_York",open:570,close:960,desc:"Treasuries, dollar funding & macro data"}
];

const doc=document.documentElement;
const grid=document.getElementById("grid");

function getRealDeviceWidth(){
  const candidates=[];
  if(window.screen && Number.isFinite(screen.width)) candidates.push(screen.width);
  if(window.visualViewport && Number.isFinite(visualViewport.width)) candidates.push(visualViewport.width);
  if(Number.isFinite(window.innerWidth)) candidates.push(window.innerWidth);
  if(Number.isFinite(document.documentElement.clientWidth)) candidates.push(document.documentElement.clientWidth);
  const positive=candidates.filter(v=>v>0);
  return positive.length ? Math.min(...positive) : 375;
}

function applyViewportMode(){
  const ua=navigator.userAgent||"";
  const touchMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  const realW=getRealDeviceWidth();
  const smallPhysical=window.screen && Math.min(screen.width,screen.height)<=700;
  const force=touchMobile || smallPhysical || realW<=700;

  if(force){
    const safe=Math.max(280,Math.min(realW,700));
    doc.classList.add("force-mobile");
    doc.style.setProperty("--device-w",safe+"px");
  }else{
    doc.classList.remove("force-mobile");
    doc.style.setProperty("--device-w","100vw");
  }
}
applyViewportMode();
window.addEventListener("resize",applyViewportMode,{passive:true});
if(window.visualViewport){
  visualViewport.addEventListener("resize",applyViewportMode,{passive:true});
}

function fmt(zone,opts){
  return new Intl.DateTimeFormat("en-GB",{timeZone:zone,...opts});
}
const parts=centres.map(c=>fmt(c.zone,{
  weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
}));
const times=centres.map(c=>fmt(c.zone,{
  hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
}));

function clockMarkup(){
  let s="";
  for(let i=0;i<12;i++){
    const a=i*30;
    s+=`<i class="tick" style="transform:translate(-50%,-50%) rotate(${a}deg) translateY(-25px)"></i>`;
  }
  return s;
}

const cards=centres.map(c=>{
  const el=document.createElement("article");
  el.className="card";
  el.innerHTML=`
    <div class="top">
      <div class="cityblock">
        <div class="city">${c.city}</div>
        <div class="zone">${c.abbr}</div>
      </div>
      <div class="badge" data-badge>Off core hours</div>
    </div>
    <div class="clock">
      ${clockMarkup()}
      <i class="hand hour"></i>
      <i class="hand minute"></i>
      <i class="hand second"></i>
      <i class="pin"></i>
    </div>
    <div class="digital" data-time>--:--:--</div>
    <div class="desc">${c.desc}</div>`;
  grid.appendChild(el);
  return el;
});

function localParts(d,i){
  const o={};
  for(const p of parts[i].formatToParts(d)){
    if(p.type!=="literal")o[p.type]=p.value;
  }
  return o;
}

function updateClockGeometry(card,h,m,s){
  card.querySelector(".hour").style.transform=`rotate(${(h%12)*30+m*.5}deg)`;
  card.querySelector(".minute").style.transform=`rotate(${m*6+s*.1}deg)`;
  card.querySelector(".second").style.transform=`rotate(${s*6}deg)`;
}

function update(){
  const now=new Date();
  centres.forEach((c,i)=>{
    const p=localParts(now,i);
    const h=(+p.hour)%24,m=+p.minute,s=+p.second;
    const mins=h*60+m;
    const weekend=p.weekday==="Sat"||p.weekday==="Sun";
    const open=!weekend&&mins>=c.open&&mins<c.close;
    const card=cards[i];
    const badge=card.querySelector("[data-badge]");

    card.querySelector("[data-time]").textContent=times[i].format(now);
    badge.textContent=open?"Core hours":"Off core hours";
    badge.classList.toggle("open",open);
    updateClockGeometry(card,h,m,s);
  });
}

try{
  centres.forEach(c=>fmt(c.zone,{}).format(new Date()));
  update();
  setInterval(update,1000);
}catch(e){
  console.error("BondStats Financial Clock:",e);
}
})();
</script>
</body>
</html>
